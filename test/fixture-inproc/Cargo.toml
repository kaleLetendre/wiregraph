# The workspace ROOT manifest. It makes this directory a compartment BOUNDARY too
# (extract/walk.js MODULE_MANIFESTS), but it holds no source file of its own, so no root
# compartment ever reaches the db — files under ecs/, sim/ and render/ attribute to the
# nearest ancestor boundary, which is their own crate. That is the shape a real Cargo
# workspace has, and it is deliberately part of the fixture: the whole reason in-process
# contracts exist is that a multi-crate workspace indexes as N disconnected islands.
[workspace]
members = ["ecs", "sim", "render"]
resolver = "2"
