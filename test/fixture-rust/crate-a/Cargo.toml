# A Cargo.toml is already a MODULE_MANIFEST (extract/walk.js), so this directory has
# always been a compartment BOUNDARY — but a compartment only reaches the db as a side
# effect of walking a PARSEABLE source file, so before `.rs` was indexable this produced
# no compartment row, no file row and no symbol. That is what the crate-a/crate-b pair
# pins.
[package]
name = "crate-a"
version = "0.0.0"
edition = "2021"
